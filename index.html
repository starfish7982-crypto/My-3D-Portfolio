<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sally Lin | Technical Product Builder</title>
    <meta name="description" content="Sally Lin — Technical professional with 6+ years bridging product strategy, UX design, and full-stack engineering across AI, manufacturing, and e-commerce." />
  </head>
  <body>
    <style>
      #root:empty {
        height: 100vh;
        background: linear-gradient(to bottom, #bae6fd, #f0f9ff);
      }
      #root:empty::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border: 4px solid rgba(255, 255, 255, 0.6);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
